{% extends 'base.html' %}

{% block title %}
  New tech — TechVault
{% endblock title %}

{% block header %}
  {{ form.media }}
{% endblock header %}

{% block search %}
{% endblock search %}

{% block content %}
  <div class="container">
    <div class="tv-pagehead">
      <div>
	<span class="tv-eyebrow">Add to the vault</span>
	<h1>New tech</h1>
      </div>
    </div>
    <div class="tv-formcard">
      <form method="POST" enctype="multipart/form-data">
	{% csrf_token %}
	{{ form.as_p }}
	<div class="d-flex gap-2 mt-4">
	  <button type="submit" class="btn btn-primary">Save tech</button>
	  <a href="{% url 'techs:list' %}" class="btn btn-secondary">Cancel</a>
	</div>
      </form>
    </div>
  </div>
{% endblock content %}
