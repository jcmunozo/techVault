<svg viewBox="13 11 38 47" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TechVault logo">
  <defs>
    <mask id="tv-keyhole">
      <rect width="64" height="64" fill="#fff"/>
      <!-- keyhole as a terminal prompt  >_ -->
      <polyline points="28,36 33,40.5 28,45" stroke="#000" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="35" y="43" width="5" height="2.6" rx="1" fill="#000"/>
    </mask>
  </defs>
  <!-- shackle (line) -->
  <path d="M22 31 V24 a10 10 0 0 1 20 0 V31" stroke="#E8A33D" stroke-width="5" stroke-linecap="round"/>
  <!-- body (solid) with keyhole cut out -->
